<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koi-dex</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ======================================================================
       APP SHELL - loaded exactly once. Every "page" after this point is a
       view swapped into <main id="app"> by the client-side router (js/app.js).
       No navigation causes a full page load.
       ====================================================================== -->

  <header class="band">
    <a class="logo" href="#/">KOI-DEX</a>
    <nav class="links" id="main-nav">
      <a href="#/koi" data-nav="koi">Koi</a>
      <a href="#/breeding" data-nav="breeding">Breeding</a>
      <a href="#/care" data-nav="care">Care</a>
      <a href="#/plants" data-nav="plants">Plants</a>
    </nav>

    <!-- AJAX component: global search.
         Typing fires GET /api/search?q=<term> (debounced); results render in
         the dropdown below and deep-link to detail views. -->
    <div class="search">
      <input id="search-input" type="search" placeholder="Search varieties…"
             autocomplete="off" aria-label="Search varieties and plants">
      <div id="search-results" class="search-results" hidden></div>
    </div>
  </header>

  <!-- The view container. The router resolves the URL hash to a view
       function, which renders here. Each view owns its AJAX calls. -->
  <main id="app" aria-live="polite">
    <!-- Views are rendered here by js/app.js:
           #/               Home        GET /api/koi (featured variety)
           #/koi            Dex grid    GET /api/koi
           #/koi/:slug      Detail      GET /api/koi/:slug
           #/plants         Plants      GET /api/plants
           #/plants/:slug   Plant       GET /api/plants/:slug
           #/breeding       Breeding    GET /api/breeding
           #/care           Care        static content, no fetch
           anything else    Not found   static content, no fetch      -->
  </main>

  <footer class="band foot">
    <span class="logo">KOI-DEX</span>
    <span>A koi encyclopedia school project. Artwork from the Koi app.</span>
  </footer>

  <!-- The template ships with an in-memory mock of the Express API so the
       shell runs from disk; js/app.js swaps to real fetch() calls with one
       function. -->
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
